[pytest]
# Pytest configuration for WebShop Report tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers (for categorizing tests)
markers =
    unit: Unit tests for individual functions
    integration: Integration tests using real test data
    slow: Tests that take longer to run (report generation)
